name: QDivZero Sync Retrieval
description: Index tracked Markdown files into a QDivZero Retrieval database
author: QDivZero

inputs:
  api-key:
    description: QDivZero API key
    required: true
  database-id:
    description: Retrieval database ID. Mutually exclusive with database-slug.
    required: false
  database-slug:
    description: Retrieval database slug. Mutually exclusive with database-id.
    required: false
  base-url:
    description: QDivZero API base URL
    required: false
    default: https://api.qdiv0.com
  paths:
    description: Newline-separated glob patterns of Markdown files to include
    required: false
    default: ""
  exclude:
    description: Newline-separated glob patterns to exclude
    required: false
    default: ""
  batch-size:
    description: Documents per index-direct request
    required: false
    default: "50"
  chunk-size:
    description: Optional maximum Unicode characters per chunk; requires chunk-overlap
    required: false
  chunk-overlap:
    description: Optional overlap in Unicode characters; requires chunk-size
    required: false
  prune:
    description: Delete previously synced documents whose tracked files were removed, within the selected paths
    required: false
    default: "false"
  remove-legacy:
    description: Remove identifiable legacy chunks after their files have been successfully indexed
    required: false
    default: "false"

outputs:
  database-id:
    description: Resolved Retrieval database ID
  files:
    description: Number of Markdown files scanned
  documents:
    description: Number of documents sent to the API
  indexed:
    description: Number of documents accepted by the API
  chunks-indexed:
    description: Number of chunks indexed when reported by the API
  removed:
    description: Number of document records removed during optional cleanup

runs:
  using: node24
  main: dist/index.cjs
